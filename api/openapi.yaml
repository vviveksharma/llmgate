openapi: 3.0.3
info:
  title: LLM Gate API
  version: 0.1.0
  description: OpenAI-compatible gateway for chat and embeddings.
servers:
  - url: http://localhost:8080
paths:
  /healthz:
    get:
      summary: Health check
      responses:
        "200":
          description: OK
  /v1/chat/completions:
    post:
      summary: Create chat completion
      security:
        - ApiKeyAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                model:
                  type: string
                messages:
                  type: array
                  items:
                    type: object
                stream:
                  type: boolean
      responses:
        "200":
          description: Completion
  /v1/embeddings:
    post:
      summary: Create embeddings
      security:
        - ApiKeyAuth: []
      responses:
        "200":
          description: Embeddings vector
components:
  securitySchemes:
    ApiKeyAuth:
      type: apiKey
      in: header
      name: X-API-Key
